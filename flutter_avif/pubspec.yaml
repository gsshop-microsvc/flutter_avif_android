name: flutter_avif
description: A flutter plugin to view and encode avif images using libavif.
version: 2.4.0
repository: https://github.com/yekeskin/flutter_avif
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_avif_platform_interface: 
    git: 
      url: https://github.com/gsshop-microsvc/flutter_avif_android.git
      ref: gsshop_v1
      path: ../flutter_avif_platform_interface/
  flutter_avif_android:
    git: 
      url: https://github.com/gsshop-microsvc/flutter_avif_android.git
      ref: gsshop_v1
      path: ../flutter_avif_android/
  flutter_avif_ios:
    git: 
      url: https://github.com/gsshop-microsvc/flutter_avif_android.git
      ref: gsshop_v1
      path: ../flutter_avif_ios/
  http: ^1.2.0
  exif: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  
flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_avif_android
      ios:
        default_package: flutter_avif_ios
